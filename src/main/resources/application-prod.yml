spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campus_ia_chatbot}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}

estabelecimento:
  site: https://www.renovomanipulacao.com.br/

logging:
  level:
    br.edu.usc.campusiachatbot: INFO
    org.hibernate.SQL: WARN
