server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

portal:
  cors:
    allowed-origins: ${PORTAL_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

azure:
  cosmos:
    enabled: ${AZURE_COSMOS_ENABLED:false}
    endpoint: ${AZURE_COSMOS_ENDPOINT:}
    database: ${AZURE_COSMOS_DATABASE:campus-ia-chatbot}
    conversas-container: ${AZURE_COSMOS_CONVERSAS_CONTAINER:conversas}
    catalogo-container: ${AZURE_COSMOS_CATALOGO_CONTAINER:catalogo}
    estabelecimentos-container: ${AZURE_COSMOS_ESTABELECIMENTOS_CONTAINER:estabelecimentos}
    catalogo-id: ${AZURE_COSMOS_CATALOGO_ID:renovo}
    estabelecimento-id: ${AZURE_COSMOS_ESTABELECIMENTO_ID:renovo}
    catalogo-batch-max-operations: ${AZURE_COSMOS_CATALOGO_BATCH_MAX_OPERATIONS:100}
    catalogo-batch-max-bytes: ${AZURE_COSMOS_CATALOGO_BATCH_MAX_BYTES:1900000}
    provisioning:
      enabled: ${AZURE_COSMOS_PROVISIONING_ENABLED:false}
    seed:
      enabled: ${AZURE_COSMOS_SEED_ENABLED:false}
    autenticacao: ${AZURE_COSMOS_AUTENTICACAO:MANAGED_IDENTITY}
    managed-identity-client-id: ${AZURE_COSMOS_MANAGED_IDENTITY_CLIENT_ID:}
    emulator-key: ${AZURE_COSMOS_EMULATOR_KEY:}
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:}
    deployment: ${AZURE_OPENAI_DEPLOYMENT:}
    authentication: ${AZURE_OPENAI_AUTHENTICATION:MANAGED_IDENTITY}
    api-key: ${AZURE_OPENAI_API_KEY:}
    managed-identity-client-id: ${AZURE_OPENAI_MANAGED_IDENTITY_CLIENT_ID:}
    timeout: ${AZURE_OPENAI_TIMEOUT:30s}
    max-output-tokens: ${AZURE_OPENAI_MAX_OUTPUT_TOKENS:800}
    max-response-bytes: ${AZURE_OPENAI_MAX_RESPONSE_BYTES:65536}

catalogo:
  backend: ${CATALOGO_BACKEND:JPA}
  consulta-ia:
    limite-itens: ${CATALOGO_CONSULTA_IA_LIMITE_ITENS:8}
    max-caracteres-contexto: ${CATALOGO_CONSULTA_IA_MAX_CARACTERES_CONTEXTO:6000}
    max-bytes-contexto: ${CATALOGO_CONSULTA_IA_MAX_BYTES_CONTEXTO:12000}

persistencia:
  backend: ${PERSISTENCIA_BACKEND:JPA}

spring:
  application:
    name: campus-ia-chatbot
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  jackson:
    default-property-inclusion: non_null

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}

ia:
  provider: ${IA_PROVIDER:GEMINI}

codex-cli:
  executable: ${CODEX_CLI_EXECUTABLE:codex}
  model: ${CODEX_CLI_MODEL:}
  timeout: ${CODEX_CLI_TIMEOUT:45s}
  max-output-bytes: ${CODEX_CLI_MAX_OUTPUT_BYTES:65536}

estabelecimento:
  nome: ${ESTABELECIMENTO_NOME:}
  tipo: ${ESTABELECIMENTO_TIPO:farmacia de manipulacao}
  horario-funcionamento: ${ESTABELECIMENTO_HORARIO_FUNCIONAMENTO:}
  endereco: ${ESTABELECIMENTO_ENDERECO:}
  formas-pagamento: ${ESTABELECIMENTO_FORMAS_PAGAMENTO:}
  condicoes-parcelamento: ${ESTABELECIMENTO_CONDICOES_PARCELAMENTO:}
  entrega: ${ESTABELECIMENTO_ENTREGA:Entregamos apenas nas cidades atendidas configuradas.}
  cidades-atendidas: ${ESTABELECIMENTO_CIDADES_ATENDIDAS:}
  uf: ${ESTABELECIMENTO_UF:}
  telefone: ${ESTABELECIMENTO_TELEFONE:}
  site: ${ESTABELECIMENTO_SITE:https://www.renovomanipulacao.com.br/}

cep-lookup:
  enabled: ${CEP_LOOKUP_ENABLED:true}
  base-url: ${CEP_LOOKUP_BASE_URL:https://viacep.com.br}
  timeout-seconds: ${CEP_LOOKUP_TIMEOUT_SECONDS:5}

chatbot:
  mensagens:
    horario-informado: "${CHATBOT_MSG_HORARIO_INFORMADO:O horario de funcionamento de {nome} e: {horario}.}"
    horario-nao-configurado: "${CHATBOT_MSG_HORARIO_NAO_CONFIGURADO:Ainda nao tenho o horario de funcionamento configurado. Vou encaminhar para a equipe confirmar essa informacao.}"
    pagamento-informado: "${CHATBOT_MSG_PAGAMENTO_INFORMADO:As formas de pagamento aceitas por {nome} sao: {formasPagamento}.}"
    pagamento-nao-configurado: "${CHATBOT_MSG_PAGAMENTO_NAO_CONFIGURADO:Ainda nao tenho as formas de pagamento configuradas. Vou encaminhar para a equipe confirmar essa informacao.}"
    endereco-informado: "${CHATBOT_MSG_ENDERECO_INFORMADO:O endereco de {nome} e: {endereco}.}"
    endereco-nao-configurado: "${CHATBOT_MSG_ENDERECO_NAO_CONFIGURADO:Ainda nao tenho o endereco configurado. Vou encaminhar para a equipe confirmar essa informacao.}"
    entrega-generica: "${CHATBOT_MSG_ENTREGA_GENERICA:Fazemos verificacao de entrega por regiao. Informe seu CEP para consultarmos a disponibilidade.}"
    entrega-cidade-atendida: "${CHATBOT_MSG_ENTREGA_CIDADE_ATENDIDA:Entregamos em toda a cidade de {cidade}.}"
    entrega-fora-area: "${CHATBOT_MSG_ENTREGA_FORA_AREA:No momento, fazemos entrega apenas em: {cidades}.}"
    entrega-solicitar-cidade: "${CHATBOT_MSG_ENTREGA_SOLICITAR_CIDADE:Fazemos entrega nas seguintes cidades: {cidades}. Informe a cidade do endereco para confirmarmos.}"
    entrega-cep-nao-validado: "${CHATBOT_MSG_ENTREGA_CEP_NAO_VALIDADO:Nao consegui validar esse CEP no momento. Informe a cidade do endereco para confirmarmos a entrega.}"
  sessao:
    janela-inatividade-minutos: ${CHATBOT_SESSAO_JANELA_INATIVIDADE_MINUTOS:30}
    max-historico-mensagens: ${CHATBOT_SESSAO_MAX_HISTORICO_MENSAGENS:10}
    processamento-expiracao-segundos: ${CHATBOT_SESSAO_PROCESSAMENTO_EXPIRACAO_SEGUNDOS:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    br.edu.usc.campusiachatbot: INFO
