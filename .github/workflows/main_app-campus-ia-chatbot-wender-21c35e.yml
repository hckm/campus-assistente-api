# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: 'Build and deploy JAR app to Azure Web App: app-campus-ia-chatbot-wender-21c35e'

on:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java version
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Build with Maven
      run: mvn --batch-mode clean verify

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with: 
        app-name: 'app-campus-ia-chatbot-wender-21c35e'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_498e8f6a31e64c50b40cd5c21c321056 }}
        package: '${{ github.workspace }}/target/*.jar'
